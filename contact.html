<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Corner | Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1 class="logo">Chai Corner</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="order.html">Order Online</a>
            <a href="about.html">About Us</a>
            <a class="active" href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="page-content">
        <section class="section form-section">
            <p class="eyebrow">We would like to hear from you</p>
            <h2>Contact Us</h2>
            <p>Have a question or suggestion? Write a message using the form below.</p>
            <form id="contactForm">
                <label for="contactName">Your name</label>
                <input type="text" id="contactName" name="contactName" placeholder="Enter your name" required>

                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="Enter a subject" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message here" required></textarea>

                <button type="submit">Send Message</button>
                <p id="contactMessage" class="form-message" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer><p>&copy; 2026 Chai Corner. All rights reserved.</p></footer>
</body>
</html>
