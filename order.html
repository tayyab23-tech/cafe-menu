<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Corner | Order Online</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1 class="logo">Chai Corner</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a class="active" href="order.html">Order Online</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="page-content">
        <section class="section form-section">
            <p class="eyebrow">Your favourites, your choice</p>
            <h2>Order Online</h2>
            <p>Fill in the form to prepare your order. This is a front-end demonstration; it does not send an order to a real café.</p>
            <form id="orderForm">
                <label for="customerName">Your name</label>
                <input type="text" id="customerName" name="customerName" placeholder="Enter your name" required>

                <label for="item">Select an item</label>
                <select id="item" name="item" required>
                    <option value="">-- Choose an item --</option>
                    <option value="Tea" data-price="80">Tea - Rs. 80</option>
                    <option value="Coffee" data-price="150">Coffee - Rs. 150</option>
                    <option value="Paratha" data-price="100">Paratha - Rs. 100</option>
                </select>

                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="1" value="1" required>

                <p class="total-line">Estimated total: <strong id="total">Rs. 0</strong></p>
                <button type="submit">Submit Order</button>
                <p id="orderMessage" class="form-message" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer><p>&copy; 2026 Chai Corner. All rights reserved.</p></footer>
</body>
</html>
